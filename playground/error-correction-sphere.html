<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shader Playground — Error Correction Sphere</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 32%, #f5f6f8 0%, #e6e8eb 55%, #d8dbdf 100%);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  #hud {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    padding: 8px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(0, 0, 0, 0.06);
    color: #3a4150;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: none;
    transition: color 0.4s;
  }
  #hud .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #2f63c9;
    transition: background 0.4s;
  }
  .lil-gui { --width: 290px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"><span class="dot"></span><span id="hudText">MONITORING</span></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
import { HorizontalBlurShader } from 'three/addons/shaders/HorizontalBlurShader.js';
import { VerticalBlurShader } from 'three/addons/shaders/VerticalBlurShader.js';
import { SubsurfaceScatteringShader } from 'three/addons/shaders/SubsurfaceScatteringShader.js';
import GUI from 'https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/+esm';

/* ============================================================
   Params (wired to GUI)
============================================================ */
const params = {
  autoCycle: true,
  rotationSpeed: 0.10,
  driftSpeed: 1.0,           // how often tiles pick a new shade
  errorRate: 3.2,            // tiles turning red per second
  errorSpread: 1.0,          // 1 = pure cascade from the seed; lower = random new clusters
  maxErrorRatio: 0.5,        // spreads far enough to stay visible while rotating
  waveDuration: 4.5,

  calmDuration: 6,
  errorsDuration: 9,
  fixedDuration: 7,

  // phase tint — shifts the inner light + SSS glow toward the phase
  // color so the state reads through all the lighting
  phaseTint: true,
  tintStrength: 0.85,

  // honeycomb SSS (the webgl_materials_subsurface_scattering material)
  tileDistortion: 0.404,
  tileAmbient: 0.064,
  tileAttenuation: 0.808,
  tilePower: 4.235,
  tileScale: 8.096,
  tileGlowColor: '#9ea9ff',
  tileShininess: 1,

  // non-SSS material settings
  tileDiffuseTint: '#ffffff',
  tileSpecular: '#333333',
  tileEmissive: '#000000',
  coreColor: '#161f4d',
  edgeShade: 0.8,

  // glossy clear coat overlaid on the SSS material
  glossStrength: 0.45,
  glossRoughness: 0.18,
  glossReflect: 1.0,
  glossBrushed: true,
  shellColor: '#ffffff',
  ringColor: '#fdfdfd',

  // shell shader — base alpha 0 keeps the middle perfectly clear;
  // the shell reads only through the fresnel rim falloff
  showShell: false,
  shellBaseAlpha: 0,
  shellRimAlpha: 0.38,
  shellFresnelPow: 3.5,
  shellRimStart: 0,     // 0 = classic fresnel; higher pushes the glass out to the silhouette
  shellBackAlpha: 0.2,
  shellGrain: 0.03,

  // glossy coat on the glass shell — additive black-diffuse physical
  // material, so it only contributes reflections/highlights
  shellGlossStrength: 0.3,
  shellGlossRoughness: 0.08,
  shellGlossReflect: 1.2,
  shellGlossClearcoat: 1.0,
  shellGlossCcRough: 0.1,
  shellGlossBrushed: false,

  // SSS point lights — static by default; orbiting is opt-in
  lightsMove: false,
  lightOrbitSpeed: 0.7,
  showLightMarkers: false,
  keyLightColor: '#ff0000',
  keyLightIntensity: 1.6,

  // contact shadow
  shadowBlur: 4.5,
  shadowDarkness: 0.9,
  shadowOpacity: 0.32,

  // floor grid
  gridVisible: true,
  gridSpacing: 0.55,
  gridOpacity: 0.4,
  gridFadeRadius: 4.0,
  gridColor: '#b4bac3',

  exposure: 1.0,

  triggerErrors() { setPhase(PHASE.ERRORS); },
  fixNow()        { setPhase(PHASE.FIXING); },
  resetBlue()     { setPhase(PHASE.RESET); },
};

/* ============================================================
   Renderer / scene / camera
============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = params.exposure;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 50);
camera.position.set(0, 0.35, 3.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 2.2;
controls.maxDistance = 8;
controls.target.set(0, 0, 0);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
keyLight.position.set(2.6, 3.2, 2.2);
scene.add(keyLight);
scene.add(new THREE.HemisphereLight(0xf2f5fa, 0xc9cdd4, 0.5));

// SSS point lights, as in webgl_materials_subsurface_scattering.
// The translucency term only reads for lights behind the ball, so the
// static positions sit behind it; the orbit toggle animates them.
const movingLights = [
  { radius: 2.4, ySwing: 1.1, speed: 1.0, phase: 0,
    p: { enabled: true, color: '#2effdc', intensity: 6.32, x: -1.6, y: 0.9, z: -1.7 } },
  { radius: 2.9, ySwing: -0.9, speed: 0.62, phase: Math.PI * 0.85,
    p: { enabled: true, color: '#e8f0ff', intensity: 1.96, x: 2.1, y: -0.5, z: -1.9 } },
].map(cfg => {
  const light = new THREE.PointLight(cfg.p.color, cfg.p.intensity, 0, 2);
  const marker = new THREE.Mesh(
    new THREE.SphereGeometry(0.045, 12, 8),
    new THREE.MeshBasicMaterial({ color: cfg.p.color })
  );
  light.add(marker);
  scene.add(light);
  return { light, marker, cfg, p: cfg.p };
});

// light INSIDE the ball — with the SSS material every tile has this
// light behind it, so the whole honeycomb glows from within
const innerLightParams = { enabled: true, color: '#4072e7', intensity: 0.64, x: 0, y: 0, z: 0 };
const innerLight = new THREE.PointLight(innerLightParams.color, innerLightParams.intensity, 0, 2);
scene.add(innerLight);

function updateMovingLights(t) {
  innerLight.visible = innerLightParams.enabled;
  innerLight.color.set(innerLightParams.color);
  innerLight.intensity = innerLightParams.intensity;
  innerLight.position.set(innerLightParams.x, innerLightParams.y, innerLightParams.z);
  for (const { light, marker, cfg, p } of movingLights) {
    if (params.lightsMove) {
      const a = t * cfg.speed * params.lightOrbitSpeed * 2 + cfg.phase;
      light.position.set(
        Math.cos(a) * cfg.radius,
        Math.sin(a * 0.7) * cfg.ySwing,
        Math.sin(a) * cfg.radius
      );
    } else {
      light.position.set(p.x, p.y, p.z);
    }
    light.visible = p.enabled;
    light.intensity = p.intensity;
    light.color.set(p.color);
    marker.material.color.set(p.color);
    marker.visible = params.showLightMarkers;
  }
  keyLight.color.set(params.keyLightColor);
  keyLight.intensity = params.keyLightIntensity;
}

/* ============================================================
   Palettes (converted to linear for vertex colors)
============================================================ */
const lin = hex => new THREE.Color(hex).convertSRGBToLinear();
const BLUES = ['#3b6fd6', '#2d5ec4', '#2452ab', '#4a7ede', '#3465c8', '#1e4699'].map(lin);
const REDS  = ['#e01f1f', '#d41818', '#ef2c2c', '#c31414'].map(lin);
const TEALS = ['#1f9478', '#188a6e', '#26a184', '#157f64', '#2aa98c'].map(lin);

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function jittered(base) {
  const c = base.clone();
  c.offsetHSL((Math.random() - 0.5) * 0.02, (Math.random() - 0.5) * 0.08, (Math.random() - 0.5) * 0.05);
  return c;
}

/* ============================================================
   Goldberg tiles — dual of a subdivided icosahedron.
   Each unique vertex becomes one hex (or pentagon) tile whose
   corners are the centroids of its adjacent faces.
============================================================ */
const DETAIL = 3;          // 10*(DETAIL+1)^2 + 2 tiles => 162
const TILE_BASE_R = 0.965; // radius where tile bases sit
const TILE_GAP = 0.86;     // shrink factor -> grooves between tiles
const TILE_DEPTH = 0.055;
const TILE_BEVEL = 0.008;
const SHELL_R = 1.12;

const icosa = new THREE.IcosahedronGeometry(1, DETAIL);
const posAttr = icosa.getAttribute('position');
const keyOf = v => `${v.x.toFixed(5)},${v.y.toFixed(5)},${v.z.toFixed(5)}`;

const vertMap = new Map();
const verts = [];
for (let f = 0; f < posAttr.count / 3; f++) {
  const centroid = new THREE.Vector3();
  const recs = [];
  for (let i = 0; i < 3; i++) {
    const v = new THREE.Vector3().fromBufferAttribute(posAttr, f * 3 + i);
    centroid.add(v);
    const k = keyOf(v);
    let rec = vertMap.get(k);
    if (!rec) {
      rec = { id: verts.length, n: v.clone().normalize(), corners: [], neighbors: new Set() };
      vertMap.set(k, rec);
      verts.push(rec);
    }
    recs.push(rec);
  }
  centroid.divideScalar(3).normalize();
  for (const a of recs) {
    a.corners.push(centroid);
    for (const b of recs) if (a !== b) a.neighbors.add(b.id);
  }
}
icosa.dispose();

// Hexagon/pentagon shape with softly rounded corners
function roundedShape(points2d, radius) {
  const shape = new THREE.Shape();
  const n = points2d.length;
  for (let i = 0; i < n; i++) {
    const prev = points2d[(i - 1 + n) % n];
    const curr = points2d[i];
    const next = points2d[(i + 1) % n];
    const inV = curr.clone().sub(prev), outV = next.clone().sub(curr);
    const r = Math.min(radius, inV.length() * 0.5, outV.length() * 0.5);
    const p1 = curr.clone().sub(inV.clone().normalize().multiplyScalar(r));
    const p2 = curr.clone().add(outV.clone().normalize().multiplyScalar(r));
    if (i === 0) shape.moveTo(p1.x, p1.y); else shape.lineTo(p1.x, p1.y);
    shape.quadraticCurveTo(curr.x, curr.y, p2.x, p2.y);
  }
  shape.closePath();
  return shape;
}

const tileGeos = [];
const tiles = [];
let vertOffset = 0;

for (const rec of verts) {
  const n = rec.n;
  const helper = Math.abs(n.y) < 0.99 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
  const u = new THREE.Vector3().crossVectors(helper, n).normalize();
  const w = new THREE.Vector3().crossVectors(n, u);

  const pts = rec.corners
    .map(c => new THREE.Vector2(c.dot(u), c.dot(w)))
    .sort((a, b) => Math.atan2(a.y, a.x) - Math.atan2(b.y, b.x))
    .map(p => p.multiplyScalar(TILE_GAP));

  const geo = new THREE.ExtrudeGeometry(roundedShape(pts, 0.003), {
    depth: TILE_DEPTH,
    bevelEnabled: true,
    bevelThickness: TILE_BEVEL,
    bevelSize: 0.005,
    bevelSegments: 2,
    curveSegments: 1,
  });

  // tile-local coordinates (before orienting), used by the fragment
  // shader for per-pixel edge shading: xy = position / circumradius,
  // z = normalized height (0 = base of wall, 1 = top face)
  const posA = geo.getAttribute('position');
  const maxR = Math.max(...pts.map(p => p.length()));
  const totalH = TILE_DEPTH + 2 * TILE_BEVEL;
  const local = new Float32Array(posA.count * 3);
  for (let i = 0; i < posA.count; i++) {
    local[i * 3] = posA.getX(i) / maxR;
    local[i * 3 + 1] = posA.getY(i) / maxR;
    local[i * 3 + 2] = Math.min(Math.max((posA.getZ(i) + TILE_BEVEL) / totalH, 0), 1);
  }
  geo.setAttribute('aTileLocal', new THREE.BufferAttribute(local, 3));

  const m = new THREE.Matrix4().makeBasis(u, w, n);
  m.setPosition(n.clone().multiplyScalar(TILE_BASE_R));
  geo.applyMatrix4(m);

  const count = geo.getAttribute('position').count;
  tiles.push({
    id: rec.id,
    center: n.clone(),
    neighbors: [...rec.neighbors],
    start: vertOffset,
    count,
    state: 'healthy',            // healthy | error | fixed
    glow: 0,                     // self-emission, ramps up while errored
    current: jittered(pick(BLUES)),
    target: null,
    nextDrift: Math.random() * 4,
  });
  tiles[tiles.length - 1].target = tiles[tiles.length - 1].current.clone();
  vertOffset += count;
  tileGeos.push(geo);
}

const merged = BufferGeometryUtils.mergeGeometries(tileGeos);
tileGeos.forEach(g => g.dispose());
const colorAttr = new THREE.BufferAttribute(new Float32Array(merged.getAttribute('position').count * 3), 3);
colorAttr.setUsage(THREE.DynamicDrawUsage);
merged.setAttribute('color', colorAttr);
const glowAttr = new THREE.BufferAttribute(new Float32Array(merged.getAttribute('position').count), 1);
glowAttr.setUsage(THREE.DynamicDrawUsage);
merged.setAttribute('aGlow', glowAttr);

// the actual SSS material from webgl_materials_subsurface_scattering,
// with vertex colors enabled so the per-tile animation still works.
// Its translucency term runs inside the point-light loop, so the
// orbiting lights are what make tiles glow when passing behind.
const whiteTex = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1);
whiteTex.needsUpdate = true;

const tileUniforms = THREE.UniformsUtils.clone(SubsurfaceScatteringShader.uniforms);
tileUniforms.thicknessMap.value = whiteTex;
tileUniforms.thicknessColor.value = new THREE.Color(params.tileGlowColor).convertSRGBToLinear();
tileUniforms.thicknessDistortion.value = params.tileDistortion;
tileUniforms.thicknessAmbient.value = params.tileAmbient;
tileUniforms.thicknessAttenuation.value = params.tileAttenuation;
tileUniforms.thicknessPower.value = params.tilePower;
tileUniforms.thicknessScale.value = params.tileScale;
tileUniforms.shininess.value = params.tileShininess;
tileUniforms.specular.value = new THREE.Color(params.tileSpecular).convertSRGBToLinear();
tileUniforms.diffuse.value = new THREE.Color(params.tileDiffuseTint).convertSRGBToLinear();
tileUniforms.emissive.value = new THREE.Color(params.tileEmissive).convertSRGBToLinear();

tileUniforms.uEdgeShade = { value: params.edgeShade };
tileUniforms.uTime = { value: 0 };

// per-pixel edge shading: the extruded hex caps have no interior vertices,
// so this has to happen in the fragment shader — a soft halo toward each
// tile's rim plus darkening down the walls, like baked ambient occlusion
const tileVert = SubsurfaceScatteringShader.vertexShader
  .replace('#include <common>', 'attribute vec3 aTileLocal;\nattribute float aGlow;\nvarying vec3 vTileLocal;\nvarying float vGlow;\n#include <common>')
  .replace('#include <begin_vertex>', 'vTileLocal = aTileLocal;\nvGlow = aGlow;\n#include <begin_vertex>');

const tileFrag = SubsurfaceScatteringShader.fragmentShader
  // suppress the scattering glow on errored tiles — the uniform blue
  // glow over their red emission is what reads as pink
  .replace(
    'vec3 thickness = thicknessColor * texture2D(thicknessMap, uv).r;',
    'vec3 thickness = thicknessColor * (1.0 - vGlow * 0.9) * texture2D(thicknessMap, uv).r;'
  )
  .replace('#include <common>', 'varying vec3 vTileLocal;\nvarying float vGlow;\nuniform float uEdgeShade;\nuniform float uTime;\n#include <common>')
  .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
  // errored tiles glow from within so they read through any lighting
  totalEmissiveRadiance += diffuseColor.rgb * vGlow * 3.2;`)
  .replace('#include <color_fragment>', `#include <color_fragment>
  {
    float radial = length(vTileLocal.xy);
    float rimT = smoothstep(0.25, 1.05, radial);
    float wallT = 1.0 - pow(clamp(vTileLocal.z, 0.0, 1.0), 1.3);
    float shade = 1.0 - uEdgeShade * min(0.55 * rimT + 0.7 * wallT, 0.75);
    diffuseColor.rgb *= shade;
  }`);

const tileMat = new THREE.ShaderMaterial({
  uniforms: tileUniforms,
  vertexShader: tileVert,
  fragmentShader: tileFrag,
  lights: true,
  vertexColors: true,
});
const tileMesh = new THREE.Mesh(merged, tileMat);

// dark core so the grooves between tiles read as shadow gaps
const core = new THREE.Mesh(
  new THREE.SphereGeometry(TILE_BASE_R + 0.005, 48, 32),
  new THREE.MeshStandardMaterial({ color: params.coreColor, roughness: 0.9 })
);

// gloss coat: same geometry rendered additively with a black-diffuse
// physical material — it contributes only reflections and specular
// highlights, so the SSS material underneath shows through unchanged
const glossMat = new THREE.MeshPhysicalMaterial({
  color: 0x000000,
  roughness: params.glossRoughness,
  metalness: 0,
  clearcoat: 1,
  clearcoatRoughness: 0.12,
  envMapIntensity: params.glossReflect,
  transparent: true,
  opacity: params.glossStrength,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  polygonOffset: true,
  polygonOffsetFactor: -1,
  polygonOffsetUnits: -1,
});
const glossMesh = new THREE.Mesh(merged, glossMat);
glossMesh.renderOrder = 1;

// brushed reflection map for the gloss coat only: procedural equirect
// texture of soft diagonal streaks, like brushed metal catching light
const brushedEnv = (() => {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const ctx = c.getContext('2d');
  const bg = ctx.createLinearGradient(0, 0, 0, 512);
  bg.addColorStop(0, '#9298a1');
  bg.addColorStop(0.45, '#5c636d');
  bg.addColorStop(1, '#363c45');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 1024, 512);
  ctx.lineCap = 'round';
  for (let i = 0; i < 320; i++) {
    const x = Math.random() * 1024, y = Math.random() * 512;
    const len = 30 + Math.random() * 140;
    const a = (-55 + (Math.random() - 0.5) * 14) * Math.PI / 180;
    const bright = Math.random() < 0.8;
    ctx.strokeStyle = bright
      ? `rgba(255, 255, 255, ${0.02 + Math.random() * 0.09})`
      : `rgba(10, 14, 20, ${0.03 + Math.random() * 0.05})`;
    ctx.lineWidth = 0.6 + Math.random() * 1.6;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const env = pmrem.fromEquirectangular(tex).texture;
  tex.dispose();
  return env;
})();
if (params.glossBrushed) glossMat.envMap = brushedEnv;

const ball = new THREE.Group();
ball.add(core, tileMesh, glossMesh);
scene.add(ball);

function writeTileColor(tile) {
  const a = colorAttr.array;
  const g2 = glowAttr.array;
  const { r, g, b } = tile.current;
  for (let i = tile.start; i < tile.start + tile.count; i++) {
    a[i * 3] = r; a[i * 3 + 1] = g; a[i * 3 + 2] = b;
    g2[i] = tile.glow;
  }
}
tiles.forEach(writeTileColor);
colorAttr.needsUpdate = true;

/* ============================================================
   Frosted shell — fresnel + subsurface-scattering style
   translucency (after webgl_materials_subsurface_scattering)
============================================================ */
const shellUniforms = {
  uColor:       { value: new THREE.Color('#ffffff').convertSRGBToLinear() },
  uBaseAlpha:   { value: params.shellBaseAlpha },
  uRimAlpha:    { value: params.shellRimAlpha },
  uFresnelPow:  { value: params.shellFresnelPow },
  uBackAlpha:   { value: params.shellBackAlpha },
  uGrain:       { value: params.shellGrain },
  uRimStart:    { value: params.shellRimStart },
};

const shellVert = /* glsl */`
  varying vec3 vNormal;
  varying vec3 vWorldPos;
  void main() {
    vNormal = normalize(mat3(modelMatrix) * normal);
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorldPos = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const shellFrag = /* glsl */`
  varying vec3 vNormal;
  varying vec3 vWorldPos;
  uniform vec3 uColor;
  uniform float uBaseAlpha, uRimAlpha, uFresnelPow, uBackAlpha, uGrain, uRimStart;

  float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

  void main() {
    vec3 N = normalize(vNormal) * (gl_FrontFacing ? 1.0 : -1.0);
    vec3 V = normalize(cameraPosition - vWorldPos);

    // rim start windows the falloff before the power curve: at 0 this is
    // the classic fresnel; raising it confines the glass to a band right
    // at the silhouette no matter how soft the power is
    float edge = 1.0 - clamp(dot(N, V), 0.0, 1.0);
    float fres = pow(smoothstep(uRimStart, 1.0, edge), uFresnelPow);

    float grain = (hash(gl_FragCoord.xy * 0.75) - 0.5) * uGrain; // frosted grain

    float alpha;
    if (gl_FrontFacing) {
      alpha = uBaseAlpha + fres * uRimAlpha;
    } else {
      alpha = fres * uBackAlpha;
    }
    // the grain rides the existing alpha instead of adding to it, so
    // where the fresnel term is zero (shell facing the camera) the
    // shell is perfectly clear and the honeycomb shades untouched —
    // the frost only shows where the rim builds up
    alpha = clamp(alpha * (1.0 + grain * 8.0), 0.0, 1.0);
    vec3 col = uColor + vec3(fres * 0.05);
    gl_FragColor = vec4(col, alpha);
  }
`;

const shellGeo = new THREE.SphereGeometry(SHELL_R, 96, 64);
const shellBack = new THREE.Mesh(shellGeo, new THREE.ShaderMaterial({
  uniforms: shellUniforms, vertexShader: shellVert, fragmentShader: shellFrag,
  transparent: true, depthWrite: false, side: THREE.BackSide,
}));
const shellFront = new THREE.Mesh(shellGeo, new THREE.ShaderMaterial({
  uniforms: shellUniforms, vertexShader: shellVert, fragmentShader: shellFrag,
  transparent: true, depthWrite: false, side: THREE.FrontSide,
}));
shellBack.renderOrder = 1;
shellFront.renderOrder = 3;

// glossy coat for the glass: like the honeycomb's gloss mesh, black
// diffuse + additive blending means it adds only env reflections and
// specular highlights — zero haze over the tiles underneath
const shellGlossMat = new THREE.MeshPhysicalMaterial({
  color: 0x000000,
  roughness: params.shellGlossRoughness,
  metalness: 0,
  clearcoat: params.shellGlossClearcoat,
  clearcoatRoughness: params.shellGlossCcRough,
  envMapIntensity: params.shellGlossReflect,
  transparent: true,
  opacity: params.shellGlossStrength,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const shellGloss = new THREE.Mesh(shellGeo, shellGlossMat);
shellGloss.renderOrder = 4;

const shellGroup = new THREE.Group();
shellGroup.visible = params.showShell;
shellGroup.add(shellBack, shellFront, shellGloss);
scene.add(shellGroup);

/* ============================================================
   Rings — dashed equator + solid meridian on the shell
============================================================ */
// pure white: no lighting, no tone mapping, drawn above the shell's haze
const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false, transparent: true });

// dashed equator: merged short torus arcs, horizontal
{
  const DASHES = 60;
  const arcs = [];
  for (let i = 0; i < DASHES; i++) {
    const arc = new THREE.TorusGeometry(SHELL_R + 0.002, 0.016, 8, 8, (Math.PI * 2 / DASHES) * 0.52);
    arc.rotateZ((Math.PI * 2 / DASHES) * i);
    arcs.push(arc);
  }
  const equator = new THREE.Mesh(BufferGeometryUtils.mergeGeometries(arcs), ringMat);
  arcs.forEach(a => a.dispose());
  equator.rotation.x = Math.PI / 2;
  equator.renderOrder = 5;
  shellGroup.add(equator);
}

// solid meridian, vertical
{
  const meridian = new THREE.Mesh(new THREE.TorusGeometry(SHELL_R + 0.002, 0.016, 8, 128), ringMat);
  meridian.rotation.y = Math.PI / 2;
  meridian.renderOrder = 5;
  shellGroup.add(meridian);
}

/* ============================================================
   Contact shadow — after webgl_shadow_contact: render the
   ball's depth from an ortho camera under the floor, blur it,
   and use the result as the shadow texture
============================================================ */
const SHADOW_SIZE = 3.2;
const SHADOW_CAM_HEIGHT = 2.7;

const shadowGroup = new THREE.Group();
shadowGroup.position.y = -SHELL_R - 0.22;
scene.add(shadowGroup);

const shadowRT = new THREE.WebGLRenderTarget(512, 512);
shadowRT.texture.generateMipmaps = false;
const shadowRTBlur = new THREE.WebGLRenderTarget(512, 512);
shadowRTBlur.texture.generateMipmaps = false;

const shadowPlaneGeo = new THREE.PlaneGeometry(SHADOW_SIZE, SHADOW_SIZE).rotateX(Math.PI / 2);
const shadowPlane = new THREE.Mesh(shadowPlaneGeo, new THREE.MeshBasicMaterial({
  map: shadowRT.texture,
  opacity: params.shadowOpacity,
  transparent: true,
  depthWrite: false,
}));
shadowPlane.scale.y = -1;
shadowGroup.add(shadowPlane);

const blurPlane = new THREE.Mesh(shadowPlaneGeo);
blurPlane.visible = false;
blurPlane.layers.enable(1);
shadowGroup.add(blurPlane);

const shadowCam = new THREE.OrthographicCamera(
  -SHADOW_SIZE / 2, SHADOW_SIZE / 2, SHADOW_SIZE / 2, -SHADOW_SIZE / 2, 0, SHADOW_CAM_HEIGHT
);
shadowCam.rotation.x = Math.PI / 2; // look straight up
shadowCam.layers.set(1);            // only sees the ball
shadowGroup.add(shadowCam);

tileMesh.layers.enable(1);
core.layers.enable(1);

const shadowDepthMat = new THREE.MeshDepthMaterial();
shadowDepthMat.userData.darkness = { value: params.shadowDarkness };
shadowDepthMat.onBeforeCompile = shader => {
  shader.uniforms.darkness = shadowDepthMat.userData.darkness;
  shader.fragmentShader = 'uniform float darkness;\n' + shader.fragmentShader.replace(
    'gl_FragColor = vec4( vec3( 1.0 - fragCoordZ ), opacity );',
    'gl_FragColor = vec4( vec3( 0.0 ), ( 1.0 - fragCoordZ ) * darkness );'
  );
};
shadowDepthMat.depthTest = false;
shadowDepthMat.depthWrite = false;

const hBlurMat = new THREE.ShaderMaterial(HorizontalBlurShader);
hBlurMat.depthTest = false;
const vBlurMat = new THREE.ShaderMaterial(VerticalBlurShader);
vBlurMat.depthTest = false;

function blurShadow(amount) {
  blurPlane.visible = true;

  blurPlane.material = hBlurMat;
  hBlurMat.uniforms.tDiffuse.value = shadowRT.texture;
  hBlurMat.uniforms.h.value = amount / 256;
  renderer.setRenderTarget(shadowRTBlur);
  renderer.render(blurPlane, shadowCam);

  blurPlane.material = vBlurMat;
  vBlurMat.uniforms.tDiffuse.value = shadowRTBlur.texture;
  vBlurMat.uniforms.v.value = amount / 256;
  renderer.setRenderTarget(shadowRT);
  renderer.render(blurPlane, shadowCam);

  blurPlane.visible = false;
}

/* ============================================================
   Floor grid — world-space anti-aliased lines fading radially
============================================================ */
const gridUniforms = {
  uColor:      { value: new THREE.Color(params.gridColor).convertSRGBToLinear() },
  uSpacing:    { value: params.gridSpacing },
  uOpacity:    { value: params.gridOpacity },
  uFadeRadius: { value: params.gridFadeRadius },
};
const gridMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 12),
  new THREE.ShaderMaterial({
    uniforms: gridUniforms,
    transparent: true,
    depthWrite: false,
    vertexShader: /* glsl */`
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      varying vec3 vWorldPos;
      uniform vec3 uColor;
      uniform float uSpacing, uOpacity, uFadeRadius;
      void main() {
        vec2 coord = vWorldPos.xz / uSpacing;
        vec2 g = abs(fract(coord - 0.5) - 0.5) / fwidth(coord);
        float line = 1.0 - min(min(g.x, g.y), 1.0);
        float fade = 1.0 - smoothstep(uFadeRadius * 0.3, uFadeRadius, length(vWorldPos.xz));
        gl_FragColor = vec4(uColor, line * fade * uOpacity);
      }
    `,
  })
);
gridMesh.rotation.x = -Math.PI / 2;
gridMesh.position.y = shadowGroup.position.y - 0.002;
gridMesh.renderOrder = 0;
shadowPlane.renderOrder = 1; // contact shadow darkens on top of the grid
scene.add(gridMesh);

function renderContactShadow() {
  scene.overrideMaterial = shadowDepthMat;
  renderer.setRenderTarget(shadowRT);
  renderer.render(scene, shadowCam);
  scene.overrideMaterial = null;

  blurShadow(params.shadowBlur);
  blurShadow(params.shadowBlur * 0.4); // second pass smooths ringing

  renderer.setRenderTarget(null);
}

/* ============================================================
   Phase state machine
   calm -> errors -> fixing (wave) -> fixed -> reset (wave) -> calm
============================================================ */
const PHASE = { CALM: 'calm', ERRORS: 'errors', FIXING: 'fixing', FIXED: 'fixed', RESET: 'reset' };
const HUD_INFO = {
  [PHASE.CALM]:   { text: 'MONITORING',      color: '#2f63c9' },
  [PHASE.ERRORS]: { text: 'ERRORS DETECTED', color: '#c23531' },
  [PHASE.FIXING]: { text: 'CORRECTING',      color: '#e0a13c' },
  [PHASE.FIXED]:  { text: 'STABILIZED',      color: '#2fa385' },
  [PHASE.RESET]:  { text: 'RESETTING',       color: '#2f63c9' },
};
const hudDot = document.querySelector('#hud .dot');
const hudText = document.getElementById('hudText');

const PHASE_TINT = {
  [PHASE.CALM]:   new THREE.Color('#4072e7'),
  [PHASE.ERRORS]: new THREE.Color('#ff1e14'),
  [PHASE.FIXING]: new THREE.Color('#eb9c3a'),
  [PHASE.FIXED]:  new THREE.Color('#2fae8c'),
  [PHASE.RESET]:  new THREE.Color('#4072e7'),
};
// per-phase tint amount: monitoring stays close to neutral, alarms go loud
const PHASE_TINT_AMT = {
  [PHASE.CALM]: 0.25,
  [PHASE.ERRORS]: 1.0,   // scaled by cascade coverage below
  [PHASE.FIXING]: 0.6,   // the repair sweep should be felt
  [PHASE.FIXED]: 0.25,
  [PHASE.RESET]: 0.25,
};
const tintCurrent = PHASE_TINT[PHASE.CALM].clone();
const tintTarget = new THREE.Color();
const tintTmp = new THREE.Color();
let tintAmt = PHASE_TINT_AMT[PHASE.CALM];

function applyPhaseTint(dt) {
  tintTarget.copy(PHASE_TINT[phase]);
  let targetAmt = PHASE_TINT_AMT[phase];
  if (phase === PHASE.ERRORS) {
    // ramp the AMOUNT with the cascade, not the color — blending the
    // color from blue to red passes through magenta and reads pink
    const coverage = Math.min(errorTiles.size / (tiles.length * Math.max(params.maxErrorRatio, 0.01)), 1);
    targetAmt = 0.3 + 0.7 * Math.sqrt(coverage);
  }
  const k = 1 - Math.exp(-dt * 2.5);
  tintCurrent.lerp(tintTarget, k);
  tintAmt += (targetAmt - tintAmt) * k;
  // note: the inner light is never tinted — it keeps its base color
  // through every phase; only the SSS glow color carries the phase
  if (params.phaseTint) {
    const s = params.tintStrength * tintAmt;
    tintTmp.set(params.tileGlowColor).lerp(tintCurrent, s);
    tileUniforms.thicknessColor.value.copy(tintTmp.convertSRGBToLinear());
  } else {
    tileUniforms.thicknessColor.value.set(params.tileGlowColor).convertSRGBToLinear();
  }
}

let phase = PHASE.CALM;
let phaseT = 0;
let errorAccum = 0;
let waveDir = new THREE.Vector3(1, 0, 0);
const errorTiles = new Set();

function setPhase(p) {
  phase = p;
  phaseT = 0;
  errorAccum = 0;
  if (p === PHASE.FIXING || p === PHASE.RESET) {
    waveDir.randomDirection();
    tiles.forEach(t => (t.waved = false));
  }
  if (p === PHASE.ERRORS && errorTiles.size === 0) infectTile(); // the seed
  const info = HUD_INFO[p];
  hudDot.style.background = info.color;
  hudText.textContent = info.text;
}
setPhase(PHASE.CALM);

function paletteFor(tile) {
  if (tile.state === 'error') return REDS;
  if (tile.state === 'fixed') return TEALS;
  return BLUES;
}

function infectTile() {
  // cascade: infect a healthy tile on the frontier of the error patch.
  // Tiles adjacent to more errors appear more often in the frontier
  // list, so the patch grows organically from the seed outward.
  let tile = null;
  if (errorTiles.size && Math.random() < params.errorSpread) {
    const frontier = [];
    for (const id of errorTiles) {
      for (const nid of tiles[id].neighbors) {
        if (tiles[nid].state === 'healthy') frontier.push(tiles[nid]);
      }
    }
    if (frontier.length) tile = pick(frontier);
  }
  if (!tile) {
    const healthy = tiles.filter(t => t.state === 'healthy');
    if (!healthy.length) return;
    const camDir = camera.position.clone().normalize();
    const v = new THREE.Vector3();
    if (errorTiles.size === 0) {
      // the seed: always the tile facing the camera dead-on, so the
      // cascade starts at the center of the visible face
      let best = healthy[0], bestDot = -2;
      for (const t of healthy) {
        const d = v.copy(t.center).applyQuaternion(ball.quaternion).dot(camDir);
        if (d > bestDot) { bestDot = d; best = t; }
      }
      tile = best;
    } else {
      // a jump to a new cluster — keep it on the visible side
      const facing = healthy.filter(t =>
        v.copy(t.center).applyQuaternion(ball.quaternion).dot(camDir) > 0.25);
      tile = pick(facing.length ? facing : healthy);
    }
  }
  tile.state = 'error';
  tile.target = jittered(pick(REDS));
  tile.nextDrift = phaseT + 1.5 + Math.random() * 4;
  errorTiles.add(tile.id);
}

function updatePhase(dt, t) {
  phaseT += dt;

  if (phase === PHASE.ERRORS) {
    const ratio = errorTiles.size / tiles.length;
    if (ratio < params.maxErrorRatio) {
      errorAccum += dt * params.errorRate * (0.5 + ratio * 2.2); // accelerates
      while (errorAccum >= 1) { infectTile(); errorAccum -= 1; }
    }
    if (params.autoCycle && phaseT > params.errorsDuration) setPhase(PHASE.FIXING);

  } else if (phase === PHASE.FIXING || phase === PHASE.RESET) {
    const progress = phaseT / params.waveDuration;
    for (const tile of tiles) {
      if (tile.waved) continue;
      const threshold = (tile.center.dot(waveDir) + 1) / 2;
      if (progress > threshold) {
        tile.waved = true;
        if (phase === PHASE.FIXING) {
          if (tile.state !== 'error') continue; // only errored tiles get recolored
          tile.state = 'fixed';
        } else {
          if (tile.state === 'healthy') continue;
          tile.state = 'healthy';
        }
        errorTiles.delete(tile.id);
        tile.target = jittered(pick(paletteFor(tile)));
        tile.nextDrift = phaseT + 2 + Math.random() * 5;
      }
    }
    if (progress > 1.15) setPhase(phase === PHASE.FIXING ? PHASE.FIXED : PHASE.CALM);

  } else if (params.autoCycle) {
    if (phase === PHASE.CALM && phaseT > params.calmDuration) setPhase(PHASE.ERRORS);
    if (phase === PHASE.FIXED && phaseT > params.fixedDuration) setPhase(PHASE.RESET);
  }

  // per-tile drift + color easing
  const k = 1 - Math.exp(-dt * 3.2);
  for (const tile of tiles) {
    if (t > tile.nextDrift) {
      tile.target = jittered(pick(paletteFor(tile)));
      tile.nextDrift = t + (2 + Math.random() * 5) / Math.max(params.driftSpeed, 0.05);
    }
    tile.current.lerp(tile.target, k);
    const glowTarget = tile.state === 'error' ? 1 : tile.state === 'fixed' ? 0.45 : 0;
    tile.glow += (glowTarget - tile.glow) * k;
    writeTileColor(tile);
  }
  colorAttr.needsUpdate = true;
  glowAttr.needsUpdate = true;
}

const fShellGloss = fShell.addFolder('gloss coat');

const fScene = gui.addFolder('Scene');

fShell.close(); fScene.close();

/* ============================================================
   Loop
============================================================ */
const clock = new THREE.Clock();
let lightTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  ball.rotation.y += dt * params.rotationSpeed;
  if (params.lightsMove) lightTime += dt;
  updateMovingLights(lightTime);
  applyPhaseTint(dt); // after updateMovingLights so it wins over base colors
  tileUniforms.uTime.value = t;
  updatePhase(dt, t);
  controls.update();
  renderContactShadow();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
